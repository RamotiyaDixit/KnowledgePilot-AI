services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledgepilot
      POSTGRES_USER: knowledgepilot
      POSTGRES_PASSWORD: knowledgepilot
    ports: ["5432:5432"]
    volumes:
      - knowledgepilot-db:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgepilot -d knowledgepilot"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://knowledgepilot:knowledgepilot@db:5432/knowledgepilot
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  knowledgepilot-db:
